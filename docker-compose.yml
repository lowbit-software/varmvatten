services:
  webapp:
    # Prebuilt in CI, promoted by the `promote` workflow. scripts/deploy.sh pins
    # an exact digest in .deploy.env so a restart can never silently drift.
    # To build from source locally, add -f docker-compose.dev.yml (see DEPLOY.md).
    image: ${APP_IMAGE:-ghcr.io/lowbit-software/varmvatten:stable}
    # Match the host user that owns ~/.config/myuplink (set in .env)
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      - MYUPLINK_CONFIG_DIR=/config
    volumes:
      - ~/.config/myuplink:/config
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/temperature', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - webapp
