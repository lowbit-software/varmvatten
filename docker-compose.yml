services:
  webapp:
    # Prebuilt in CI, promoted by the `promote` workflow. scripts/deploy.sh pins
    # an exact digest in .deploy.env so a restart can never silently drift.
    # To build from source locally, add -f docker-compose.dev.yml (see DEPLOY.md).
    image: ${APP_IMAGE:-ghcr.io/lowbit-software/varmvatten:stable}
    # Match the host user that owns ~/.config/myuplink (set in .env)
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      - MYUPLINK_CONFIG_DIR=/config
    volumes:
      - ~/.config/myuplink:/config
    # No `ports:` by default. The tunnel reaches this over the compose network
    # (http://webapp:5000) and deploy.sh health-checks it the same way. A host that
    # also wants a LAN listener opts in through docker-compose.lan.yml, which
    # keeps exposure a per-host decision in .env rather than a property of the
    # repo.
    restart: unless-stopped
    healthcheck:
      # /healthz, not /api/temperature. The latter answered 200 for all 31 hours
      # of the 2026-08-22 outage, because Flask's main thread was fine — it was
      # the poll thread that was wedged, and nothing asked about it. /healthz
      # does, and deliberately still reports healthy when myUplink is merely
      # down, so somebody else's outage cannot flap this container.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 20s

  cloudflared:
    # Pinned, not `:latest`. `:latest` was worse than it looked here: nothing
    # re-pulls it (deploy.sh pulls only the app image), so all three projects
    # sat on the June build for three months while the tag implied currency —
    # neither reproducible nor current. An explicit version makes the staleness
    # visible in the file, and Dependabot turns the bump into a PR rather than
    # something somebody has to remember. See .github/dependabot.yml.
    #
    # Tag AND digest: the tag is what a human reads, the digest is what is
    # actually pulled. A version tag alone is a promise the publisher can
    # break by repushing it; the digest cannot be retargeted. Dependabot
    # understands this form and bumps both together.
    image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - webapp
