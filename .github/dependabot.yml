# Keeps the pinned cloudflared connector moving without anyone having to
# remember it. A new Cloudflare release becomes a pull request, which is work
# that already gets done here — unlike a calendar reminder or a note in a
# runbook, both of which were the previous plan and both of which fail quietly.
#
# The cadence lives next to `schedule:` below, not here. It was stated in both
# places and the two disagreed the moment one changed — which is exactly what
# happened when this moved off monthly.
#
# This does NOT cover the Dockerfile base image (python:3.12-slim) — that is
# `package-ecosystem: docker`, a separate entry. Deliberately left out for now
# so this change is one thing; add it when the PR volume here proves tolerable.
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    # Daily, not monthly. Monthly keeps PR volume down, which is the right trade
    # for an entry watching many dependencies. This one is scoped by `allow` to a
    # SINGLE image that Cloudflare ships roughly monthly, so daily polling yields
    # the same ~12 PRs a year — it only shortens how long an old one sits here.
    #
    # That latency is the entire cost, and it was paid on 2026-10-20: Cloudflare
    # disclosed that cloudflared before 2026.10.2 trusts eMudhra intermediate
    # certificates with weak private keys. On the monthly cadence, four of the
    # five tunnels on this host had no PR open at all, and the one that did
    # proposed 2026.10.0 — itself still vulnerable. The connector is the most
    # exposed component in this stack; it is worth asking about every day.
    schedule:
      interval: "daily"
    # `allow` is what scopes this, NOT `groups`. Groups only decide how updates
    # are batched into PRs — an ungrouped dependency still gets its own PR. The
    # one that matters here is the app image: `${APP_IMAGE:-…:stable}` carries
    # `:stable`, a moving tag owned by the promote workflow, and Dependabot
    # raising PRs against it would fight the deployment model outright.
    allow:
      - dependency-name: "cloudflare/cloudflared"
    groups:
      cloudflared:
        patterns:
          - "cloudflare/cloudflared"
    commit-message:
      prefix: "chore"
