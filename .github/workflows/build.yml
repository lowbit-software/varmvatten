name: build

# Builds every push to main and every PR. Pushes to GHCR only for main.
# Building is NOT deploying — the box only ever runs what `promote` tags as
# `:stable`. See DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: varmvatten:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # Must import cleanly and register its routes with no NIBE creds present.
          docker run --rm --entrypoint python varmvatten:ci -c "
          import app
          routes = {r.rule for r in app.app.url_map.iter_rules()}
          for required in ('/api/temperature', '/healthz'):
              assert required in routes, (required, routes)
          print('ok:', sorted(routes))
          "

      # Both suites guard the 2026-08-22 outage, from its two ends: the poller
      # hanging on a silent upstream, and the page presenting a reading it can no
      # longer stand behind. Timeout-bounded on purpose — the pre-fix failure mode
      # is a hang, not an error, so a regression here would otherwise sit until
      # the job's own limit rather than failing fast.
      - name: Poller — survives an upstream that never answers
        timeout-minutes: 2
        run: docker run --rm --entrypoint python varmvatten:ci tests/poller.py

      - name: Page — never presents a reading it cannot stand behind
        timeout-minutes: 2
        run: node tests/staleness_ui.mjs

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Served entirely from the cache populated above — no rebuild.
          cache-from: type=gha
