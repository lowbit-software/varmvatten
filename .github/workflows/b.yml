name: b-smoketest-block
on: push
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: |
          # Must import cleanly and register its routes with no NIBE creds present.
          echo "docker run --rm --entrypoint python varmvatten:ci -c \"
          import app
          routes = {r.rule for r in app.app.url_map.iter_rules()}
          assert '/api/temperature' in routes, routes
          print('ok:', sorted(routes))
          \""
